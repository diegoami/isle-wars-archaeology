name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No original game files are tracked (CLAUDE.md rule 18).
      - run: python3 tools/check_no_originals.py
      # Relative Markdown links resolve and JSON files parse.
      - run: python3 tools/check_links.py
      - run: python3 tools/check_design.py && python3 -m unittest tools.tests.test_check_design  # checks the design files (core-rules.md, variety.md, computer.md and ui.md): one design row per spec claim, and in ui.md per Q-UI question
      # Reviewer's external_directory grant covers the script's review worktree (fix #208).
      - run: python3 tools/check_reviewer_grant.py && python3 -m unittest tools.tests.test_check_reviewer_grant
      # The T44 single-exchange mechanism and its checker flag (synthetic boards, no wine).
      - run: python3 -m unittest tools.tests.test_e022_single_exchange
      # The copied harness tools run here (harness.lock pins them).
      - run: node tools/harness/review.mjs --self-test
      # Citation discipline for the findings with runs (T25, Done-when 2/4). The list is
      # explicit, not findings/F*.md: F001 and F004 are purely static and F010+ are out of
      # scope at the pinned 1bcdb70 tool, so a glob over all findings could never be green.
      - run: for f in findings/F002-iwp-runtime-wine-xvfb.md findings/F003-iwp-observable-state-inventory.md findings/F005-iw-dos-runtime-dosbox-x.md findings/F006-iwp-driver-cycle.md findings/F007-iw-dos-observable-state-inventory.md findings/F009-iw-dos-save-format.md; do python3 tools/check_citations.py "$f" || exit 1; done
      # The E020 reader (T40) and its tests use numpy: the version on the user's machine.
      - run: python3 -m pip install numpy==1.26.4
      # Registration, the format rules and the guards (T02).
      - run: python3 -m unittest discover -s tests
